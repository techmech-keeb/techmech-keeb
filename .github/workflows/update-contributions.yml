name: Update external contributions

on:
  schedule:
    # 06:00 JST on Mondays (21:00 UTC on Sundays).
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the external-contributions block
        run: python3 scripts/update_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Open a pull request if the list changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-external-contributions
          delete-branch: true
          commit-message: Update external contributions list
          title: Update external contributions list
          body: |
            Automated update of the `Open-source contributions` block in
            README.md, regenerated by `scripts/update_contributions.py`
            from pull requests authored by this account and merged in
            repositories outside it.

            Review before merging: link text, terminology (AGENTS.md), and
            that every listed PR is expected.
